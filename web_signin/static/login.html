<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>登录 · 班级魔方自动签到</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center; color: #e5e7eb; font-family: system-ui, "Segoe UI", sans-serif; background: radial-gradient(circle at top, #1e293b, #020617 65%); }
    .card { width: 100%; max-width: 440px; padding: 30px; border: 1px solid #334155; border-radius: 18px; background: #0b1425; box-shadow: 0 20px 65px #0007; }
    .brand { color: #38bdf8; font-size: 12px; letter-spacing: .12em; }
    h1 { margin: 12px 0; font-size: 24px; }
    .hint { font-size: 13px; color: #94a3b8; line-height: 1.7; }
    label { display: block; margin: 22px 0 8px; font-size: 13px; }
    input { width: 100%; padding: 12px 14px; color: #e5e7eb; background: #111d30; border: 1px solid #334155; border-radius: 10px; font-size: 15px; }
    input:focus { outline: 2px solid #38bdf8; outline-offset: 2px; }
    button { width: 100%; margin-top: 26px; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(135deg, #38bdf8, #6366f1); color: #07111f; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #loginError { min-height: 20px; margin-top: 14px; color: #fca5a5; font-size: 13px; }
    @media (max-width: 600px) {
      body { padding: 16px; min-height: 100svh; }
      .card { padding: 24px 20px; }
      input { font-size: 16px; min-height: 46px; }
      button { min-height: 46px; }
    }
  </style>
</head>
<body>
  <form id="loginForm" class="card">
    <div class="brand">WEB SIGN-IN</div>
    <h1>管理员登录</h1>
    <div class="hint">登录后可配置随机签到、固定兜底时间，查看任务状态和日志。</div>
    <label for="adminUsername">管理员账号</label>
    <input id="adminUsername" autocomplete="username" value="admin" required />
    <label for="adminPassword">管理员密码</label>
    <input id="adminPassword" type="password" autocomplete="current-password" required />
    <button id="btnLogin" type="submit">登录网站</button>
    <div id="loginError" role="alert"></div>
  </form>
  <script src="/static/login.js" defer></script>
</body>
</html>
