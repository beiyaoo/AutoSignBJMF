services:
  web_signin:
    image: bjmf-web:private
    build:
      context: .
      dockerfile: web_signin/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: bjmf-web
    restart: unless-stopped
    ports:
      - "${WEB_SIGNIN_HOST_PORT:-${WEB_SIGNIN_PORT:-3155}}:${WEB_SIGNIN_PORT:-9988}"
    environment:
      WEB_SIGNIN_PORT: ${WEB_SIGNIN_PORT:-9988}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 docker.env 中设置 ADMIN_PASSWORD}
    volumes:
      - "${WEB_SIGNIN_DATA_DIR:-./bjmf-web-data}:/app/web_signin/db"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.getenv('WEB_SIGNIN_PORT','9988')+'/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

